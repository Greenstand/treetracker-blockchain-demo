apiVersion: v1
kind: Service
metadata:
  name: treetracker-web-service
  namespace: treetracker-webapp-mvp
  labels:
    app: treetracker-web
spec:
  type: NodePort
  selector:
    app: treetracker-web
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    nodePort: 30000
    protocol: TCP
